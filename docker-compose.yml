services:
  analytics-engine:
    build: ./services/analytics-engine
    ports:
      - "${ANALYTICS_PORT:-8001}:8001"
    environment:
      - ANALYTICS_PORT=8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ingestion-gateway:
    build: ./services/ingestion-gateway
    ports:
      - "${INGESTION_PORT:-8002}:8002"
    environment:
      - INGESTION_PORT=8002
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard-api:
    build: ./services/dashboard-api
    ports:
      - "${DASHBOARD_PORT:-8003}:8003"
    environment:
      - DASHBOARD_PORT=8003
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
